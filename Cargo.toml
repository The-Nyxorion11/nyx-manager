[package]
name = "nyx-gestor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nyx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"